# Здесь настройка ruff, mypy и coverage: проект не пакетируется.

[tool.ruff]
target-version = "py312"
line-length = 88
exclude = [".venv"]

[tool.ruff.lint]
select = [
    # E — ошибки стиля (pycodestyle), F — pyflakes, I — порядок импортов.
    "E",
    "F",
    "I",
    # B — bugbear: типичные ловушки (изменяемые аргументы по умолчанию, zip без strict).
    "B",
    # C901 — цикломатическая сложность функции выше порога.
    "C901",
    # PLR0912 — слишком много ветвлений в функции.
    "PLR0912",
    # PLR0913 — слишком много аргументов у функции.
    "PLR0913",
    # PLR0915 — слишком много операторов в функции.
    "PLR0915",
    # E722 — голый except: без типа исключения.
    "E722",
    # BLE001 — except Exception: ловит всё подряд.
    "BLE001",
    # S110 — except с одним pass: ошибка проглатывается молча.
    "S110",
    # SIM — места, которые пишутся проще (вложенные with/if, лишние ветки).
    "SIM",
]

[tool.ruff.lint.isort]
# Свой пакет явно: импорты `collector` сортируются отдельной группой после сторонних.
known-first-party = ["collector"]

[tool.ruff.lint.mccabe]
# C901 считает не только if, но и циклы, and/or, except — порог строже max-branches; 8 — решение Андрея (14.10, land-monitor).
max-complexity = 8

[tool.ruff.lint.pylint]
# CLAUDE.md §6: ветвление чаще чем раз в 4 строки 40-строчной функции — предел.
max-branches = 10
# CLAUDE.md §6: больше 5 аргументов — собрать их в dataclass.
max-args = 5
# CLAUDE.md §6: функция до 40 строк ≈ 30 операторов.
max-statements = 30

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    # Почему: фикстуры pytest приходят аргументами теста, их бывает больше 5.
    "PLR0913",
    # Почему: длинные блоки «дано/ожидаем» в тесте читаются подряд, дробить хуже.
    "PLR0915",
]

[tool.mypy]
# Мягкий режим, без strict: проверяются подсказки типов, которые уже есть (CLAUDE.md §6).
# Сборщик collector/ и инструменты scripts/; tests/ не проверяются.
# Список здесь — чтобы `python -m mypy` везде шёл без аргументов.
files = ["collector", "scripts"]
# Сторонний модуль без подсказок типов — не ошибка нашего кода.
ignore_missing_imports = true

[tool.coverage.run]
# Покрытие считается по коду сборщика collector/ — он покрыт тестами
# модуля 21 (docs/TEST_PLAN.md).
source = ["collector"]
# Покрытие ветвлений нужно, чтобы видеть невыполненные ветки ошибок.
branch = true

[tool.coverage.report]
# Порог 100 % задаётся только здесь, в командах не дублируется (CLAUDE.md §7).
fail_under = 100
# Номера непокрытых строк и ветвлений — в отчёте сразу.
show_missing = true
